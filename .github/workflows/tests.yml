name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: solver-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q solver app.py
        env:
          PYTHONPATH: .
      - run: node --check js/game.js
      - run: python -m pytest -q
        env:
          PYTHONPATH: .
